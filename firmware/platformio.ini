; PlatformIO project config for the DJ controller firmware.
; Target: Arduino Nano RP2040 Connect, using earlephilhower/arduino-pico core.
; See ../hardware-docs/nano-rp2040-connect.md for pinout + project conventions.

[env:nanorp2040connect]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = arduino_nano_connect
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
; -DUSE_TINYUSB swaps the Pico SDK USB stack for Adafruit TinyUSB so we can
; expose a composite CDC + USB-MIDI device. Serial.print keeps working.
; USB_MANUFACTURER / USB_PRODUCT set the device name macOS / Mixxx see.
build_flags =
  -DUSE_TINYUSB
  ; Bundle -U + -D in a single quoted token so PIO doesn't reorder them and
  ; the -U lands right before the -D. Otherwise the variant's -DUSB_PRODUCT
  ; would override ours, or our -U would nuke everything. See:
  ; https://github.com/platformio/platformio-core/issues/4310
  '-UUSB_MANUFACTURER "-DUSB_MANUFACTURER=\"DJ Build\""'
  '-UUSB_PRODUCT "-DUSB_PRODUCT=\"ISMA 3000\""'
lib_deps =
  fortyseveneffects/MIDI Library@^5.0.2
monitor_speed = 115200
; log2file writes everything pio device monitor receives into logs/<env>-<timestamp>.log.
; Lets a headless caller (CI / agent) tail the file instead of needing an interactive TTY.
; https://docs.platformio.org/en/latest/projectconf/sections/env/options/monitor/monitor_filters.html
monitor_filters = log2file
