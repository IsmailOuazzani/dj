; PlatformIO project config for the DJ controller firmware.
; Target: Arduino Nano RP2040 Connect, using earlephilhower/arduino-pico core.
; See ../hardware-docs/nano-rp2040-connect.md for pinout + project conventions.

[env:nanorp2040connect]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = arduino_nano_connect
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
monitor_speed = 115200
; log2file writes everything pio device monitor receives into logs/<env>-<timestamp>.log.
; Lets a headless caller (CI / agent) tail the file instead of needing an interactive TTY.
; https://docs.platformio.org/en/latest/projectconf/sections/env/options/monitor/monitor_filters.html
monitor_filters = log2file
