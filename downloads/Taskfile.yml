version: '3'

# Download YouTube audio into ~/Music/DJ as lossless WAV using yt-dlp + ffmpeg.
# All tasks depend on `setup`, which is idempotent: it only does work if the
# venv, uv, yt-dlp, or ffmpeg are missing.

tasks:
  setup:
    desc: Idempotently provision venv (uv + yt-dlp) and ffmpeg
    status:
      - test -x .venv/bin/yt-dlp
      - test -x .venv/bin/uv
      - command -v ffmpeg
    cmds:
      - test -d .venv || python3 -m venv .venv
      - .venv/bin/pip install --quiet --upgrade pip uv
      - .venv/bin/uv pip install --python .venv/bin/python -r requirements.txt
      - command -v ffmpeg >/dev/null || brew install ffmpeg

  dl:
    desc: 'Download YouTube audio as WAV to ~/Music/DJ (usage: task dl -- <URL>)'
    deps: [setup]
    cmds:
      - mkdir -p "$HOME/Music/DJ"
      - .venv/bin/yt-dlp -x --audio-format wav --audio-quality 0 -o "$HOME/Music/DJ/%(title)s.%(ext)s" {{.CLI_ARGS}}

  yt-dl:
    desc: 'Download YouTube audio as FLAC to ~/Music/DJ (usage: task yt-dl -- <URL>)'
    deps: [setup]
    cmds:
      - mkdir -p "$HOME/Music/DJ"
      - .venv/bin/yt-dlp -x --audio-format flac --audio-quality 0
          --embed-metadata --embed-thumbnail
          --sleep-interval 2 --sleep-requests 1
          --retries 10 --retry-sleep exp=1:60:2
          --download-archive "$HOME/Music/DJ/.archive"
          --cookies cookies.txt
          --js-runtimes node --remote-components ejs:github
          -o "$HOME/Music/DJ/%(title)s.%(ext)s"
          {{.CLI_ARGS}}

  sc-dl:
    desc: 'Download SoundCloud track or playlist as WAV to ~/Music/DJ (usage: task sc-dl -- <URL>)'
    deps: [setup]
    cmds:
      - mkdir -p "$HOME/Music/DJ"
      - .venv/bin/yt-dlp -x --audio-format flac --audio-quality 0
          --embed-metadata --embed-thumbnail
          --sleep-interval 3 --sleep-requests 2
          --download-archive "$HOME/Music/DJ/.archive"
          --username oauth --password 2-329470-793015837-34PDQcozgf4mz2
          -o "$HOME/Music/DJ/%(title)s.%(ext)s"
          {{.CLI_ARGS}}
